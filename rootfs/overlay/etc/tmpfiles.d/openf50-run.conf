# The daemons' directories in /run, made by root at boot before anybody else can take the names (/run is mounted
# 1777 on these images; openf50-atd and openf50-voice check and recover on their own as well: /opt/openf50/lib/run-dir.sh).
d /run/openf50-at 0755 root root -
d /run/openf50-voice 0700 root root -
