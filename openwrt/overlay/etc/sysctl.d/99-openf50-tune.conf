# OpenF50 network tuning (5G CPE on the vendor 5.4 kernel):
# fq_codel everywhere - bufferbloat on a cellular link hurts more than raw throughput;
# BBR is not in this kernel (reno/cubic only), so the qdisc is what we can fix.
net.core.default_qdisc=fq_codel
net.core.netdev_max_backlog=2048
# 5G bandwidth-delay product needs more than the stock 256 KiB ceilings
net.ipv4.tcp_rmem=4096 87380 8388608
net.ipv4.tcp_wmem=4096 65536 8388608
net.core.rmem_max=8388608
net.core.wmem_max=8388608
